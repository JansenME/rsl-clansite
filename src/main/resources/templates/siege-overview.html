<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Siege Overview</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" th:href="@{/styles/css/main.css}" />
    <script th:src="@{/styles/js/main.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        .siege-section {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 40px;
            margin-top: 25px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: relative;
        }

        /* The Sticky Container */
        .sticky-header-wrapper {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: #ffffff;

            /* UPDATED: Reduced padding back to normal */
            padding-top: 20px;

            margin: -20px -20px 20px -20px;
            padding-left: 20px;
            padding-right: 20px;
            border-bottom: 1px solid #f0f0f0;
            box-shadow: 0 4px 6px -4px rgba(0,0,0,0.1);
        }

        .siege-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .siege-title {
            margin: 0;
            font-size: 1.5em;
            color: #333;
            margin-top: 5px;
        }
        .siege-status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
        }
        .status-PREP { background-color: #f39c12; }
        .status-MATCHMAKING { background-color: #3498db; }
        .status-BATTLE { background-color: #e74c3c; }
        .status-FINISHED { background-color: #95a5a6; }

        /* Points Ribbon */
        .siege-stats-ribbon {
            display: flex;
            justify-content: center;
            gap: 20px;
            background: #f8f9fa;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #eee;
        }
        .stat-box {
            text-align: center;
        }
        .stat-label { font-size: 0.75em; color: #777; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 1.2em; font-weight: bold; color: #333; }
        .stat-total { color: #2980b9; }

        /* Grid for Map Tables */
        .map-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        @media screen and (max-width: 980px) {
            .map-grid { grid-template-columns: 1fr; }
        }

        .map-box h3 {
            text-align: center;
            background-color: #f9f9f9;
            padding: 10px;
            border: 1px solid #eee;
            margin-bottom: 0;
            font-size: 1.1em;
        }
        .def-header { border-bottom: 3px solid #3498db !important; color: #2c3e50; }
        .atk-header { border-bottom: 3px solid #e74c3c !important; color: #c0392b; }

        table.siege-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85em;
            margin-bottom: 0;
        }
        table.siege-table th, table.siege-table td {
            border: 1px solid #eee;
            padding: 8px;
            text-align: center;
            vertical-align: middle;
        }
        table.siege-table th {
            background-color: #fcfcfc;
            font-weight: bold;
            color: #555;
        }

        tr.structure-cleared,
        tr.structure-cleared td {
            background-color: #ffebee !important;
            color: #c0392b !important;
        }
        tr.structure-cleared .name-cell {
            text-decoration: line-through;
        }

        .structure-ok {
            color: #27ae60;
        }

        .primary-highlight {
            border: 2px solid #3498db;
        }

        .primary-badge {
            position: absolute;
            /* UPDATED: Negative top value pulls it 'outside' the div */
            top: -12px;
            left: 20px;
            background: #3498db;
            color: white;
            padding: 3px 12px;
            font-size: 0.75em;
            border-radius: 4px;
            font-weight: bold;
            z-index: 101;
        }

        /* Action Buttons */
        .btn-action {
            border: none;
            background: none;
            cursor: pointer;
            padding: 5px;
            transition: transform 0.2s;
        }
        .btn-action:hover { transform: scale(1.1); }
        .btn-destroy { color: #e74c3c; }
        .btn-restore { color: #27ae60; }
        .btn-capture { color: #2980b9; }
    </style>
</head>
<body>
<div id="page-wrapper">
    <section id="header">
        <div th:insert="~{inserts/nav :: nav}" class="container"></div>
    </section>

    <section id="content">
        <div class="container">
            <div class="row">
                <div class="col-8">
                    <h2><i class="fas fa-binoculars"></i> Live Battlefield</h2>
                </div>
                <div class="col-4" style="text-align: right;">
                    <a th:href="@{/siege}" class="button alt small">Back to Siege Hub</a>
                </div>
            </div>

            <div th:each="siege, iterStat : ${siegeList}"
                 class="siege-section"
                 th:classappend="${siege.clanGroup == primaryGroup} ? 'primary-highlight' : ''">

                <div class="sticky-header-wrapper">
                    <div th:if="${siege.clanGroup == primaryGroup}" class="primary-badge">YOUR ACTIVE CLAN</div>

                    <div class="siege-header">
                        <h3 class="siege-title">
                            <span th:text="${siege.clanGroup.name}">T1/T2</span>
                            <span style="color: #ccc; margin: 0 10px;">vs</span>
                            <span th:text="${siege.opponentClanName}">Opponent</span>
                        </h3>
                        <div>
                            <span class="siege-status"
                                  th:classappend="'status-' + ${siege.status}"
                                  th:text="${siege.status.displayName}">STATUS</span>
                            <small style="margin-left: 10px; color: #777;">
                                Started: <span th:text="${#temporals.format(siege.startDate, 'dd MMM')}">Date</span>
                            </small>
                        </div>
                    </div>

                    <div class="siege-stats-ribbon">
                        <div class="stat-box">
                            <div class="stat-label">Defense Points</div>
                            <div class="stat-value" th:id="'def-points-' + ${siege.id}" th:text="${siege.currentDefensePoints}">0</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Attack Points</div>
                            <div class="stat-value" th:id="'atk-points-' + ${siege.id}" th:text="${siege.currentAttackPoints}">0</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Total Score</div>
                            <div class="stat-value stat-total" th:id="'total-points-' + ${siege.id}" th:text="${siege.totalPoints}">0</div>
                        </div>
                    </div>
                </div>
                <div class="map-grid">
                    <div class="map-box">
                        <h3 class="def-header"><i class="fas fa-shield-alt"></i> Defense Map (Our Base)</h3>
                        <table class="siege-table">
                            <thead>
                            <tr>
                                <th>Structure</th>
                                <th>Pts</th>
                                <th>Status</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="struct : ${siege.defensiveStructures}"
                                th:classappend="${struct.isCleared} ? 'structure-cleared' : ''"
                                th:id="'struct-row-' + ${struct.id}">
                                <td class="name-cell" th:text="${struct.name}" style="text-align: left; padding-left: 15px;">Name</td>
                                <td th:text="${struct.defensePoints}">0</td>
                                <td>
                                    <div sec:authorize="hasRole('COORDINATOR') or hasRole('ADMIN') or hasRole('OWNER')">
                                        <form method="POST" th:action="@{/siege/structure/update}" class="ajax-form">
                                            <input type="hidden" name="siegeId" th:value="${siege.id}" />
                                            <input type="hidden" name="structureId" th:value="${struct.id}" />
                                            <input type="hidden" name="mapType" value="DEFENSE" />

                                            <input th:if="${!struct.isCleared}" type="hidden" name="isCleared" value="true" />
                                            <button th:if="${!struct.isCleared}" type="submit" class="btn-action btn-destroy" title="Mark as Destroyed">
                                                <i class="fas fa-bomb"></i> Destroy
                                            </button>

                                            <input th:if="${struct.isCleared}" type="hidden" name="isCleared" value="false" />
                                            <button th:if="${struct.isCleared}" type="submit" class="btn-action btn-restore" title="Mark as Intact">
                                                <i class="fas fa-undo"></i> Restore
                                            </button>
                                        </form>
                                    </div>

                                    <div sec:authorize="!hasRole('COORDINATOR') and !hasRole('ADMIN') and !hasRole('OWNER')">
                                        <span th:if="${!struct.isCleared}" class="structure-ok"><i class="fas fa-check-circle"></i> Intact</span>
                                        <span th:if="${struct.isCleared}"><i class="fas fa-skull"></i> Destroyed</span>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="map-box">
                        <h3 class="atk-header"><i class="fas fa-crosshairs"></i> Target Map (Enemy Base)</h3>
                        <table class="siege-table">
                            <thead>
                            <tr>
                                <th>Structure</th>
                                <th>Pts</th>
                                <th>Status</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="struct : ${siege.targetStructures}"
                                th:classappend="${struct.isCleared} ? 'structure-cleared' : ''"
                                th:id="'struct-row-' + ${struct.id}">
                                <td class="name-cell" th:text="${struct.name}" style="text-align: left; padding-left: 15px;">Name</td>
                                <td th:text="${struct.attackPoints}">0</td>
                                <td>
                                    <div sec:authorize="hasRole('COORDINATOR') or hasRole('ADMIN') or hasRole('OWNER')">
                                        <form method="POST" th:action="@{/siege/structure/update}" class="ajax-form">
                                            <input type="hidden" name="siegeId" th:value="${siege.id}" />
                                            <input type="hidden" name="structureId" th:value="${struct.id}" />
                                            <input type="hidden" name="mapType" value="TARGET" />

                                            <input th:if="${!struct.isCleared}" type="hidden" name="isCleared" value="true" />
                                            <button th:if="${!struct.isCleared}" type="submit" class="btn-action btn-capture" title="Mark as Captured">
                                                <i class="fas fa-flag"></i> Capture
                                            </button>

                                            <input th:if="${struct.isCleared}" type="hidden" name="isCleared" value="false" />
                                            <button th:if="${struct.isCleared}" type="submit" class="btn-action btn-restore" title="Undo Capture">
                                                <i class="fas fa-undo"></i> Restore
                                            </button>
                                        </form>
                                    </div>

                                    <div sec:authorize="!hasRole('COORDINATOR') and !hasRole('ADMIN') and !hasRole('OWNER')">
                                        <span th:if="${!struct.isCleared}" style="color: #e74c3c;">Active</span>
                                        <span th:if="${struct.isCleared}" class="structure-ok"><i class="fas fa-flag"></i> Captured</span>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div style="text-align: center; margin-top: 2em;">
                <a th:href="@{/siege}" class="button">Back to Siege Hub</a>
            </div>
        </div>
    </section>

    <div th:insert="~{inserts/copyright :: copyright}" id="copyright"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const forms = document.querySelectorAll('.ajax-form');

        forms.forEach(form => {
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const formData = new FormData(this);
                const actionUrl = this.action;
                const button = this.querySelector('button');
                button.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

                fetch(actionUrl, {
                    method: 'POST',
                    body: formData,
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        updateUI(this, data);
                    } else {
                        window.location.reload();
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    window.location.reload();
                });
            });
        });

        function updateUI(form, data) {
            const structureId = form.querySelector('input[name="structureId"]').value;
            const siegeId = form.querySelector('input[name="siegeId"]').value;
            const isClearedInput = form.querySelector('input[name="isCleared"]');
            const wasClearing = isClearedInput.value === 'true';
            const mapType = form.querySelector('input[name="mapType"]').value;

            const row = document.getElementById('struct-row-' + structureId);
            if (wasClearing) {
                row.classList.add('structure-cleared');
            } else {
                row.classList.remove('structure-cleared');
            }

            const button = form.querySelector('button');
            if (wasClearing) {
                isClearedInput.value = 'false';
                button.className = 'btn-action btn-restore';
                button.title = (mapType === 'DEFENSE') ? 'Mark as Intact' : 'Undo Capture';
                button.innerHTML = '<i class="fas fa-undo"></i> Restore';
            } else {
                isClearedInput.value = 'true';
                if (mapType === 'DEFENSE') {
                    button.className = 'btn-action btn-destroy';
                    button.title = 'Mark as Destroyed';
                    button.innerHTML = '<i class="fas fa-bomb"></i> Destroy';
                } else {
                    button.className = 'btn-action btn-capture';
                    button.title = 'Mark as Captured';
                    button.innerHTML = '<i class="fas fa-flag"></i> Capture';
                }
            }

            const defEl = document.getElementById('def-points-' + siegeId);
            const atkEl = document.getElementById('atk-points-' + siegeId);
            const totEl = document.getElementById('total-points-' + siegeId);

            if (defEl) defEl.innerText = data.newDefensePoints;
            if (atkEl) atkEl.innerText = data.newAttackPoints;
            if (totEl) totEl.innerText = data.newTotalPoints;
        }
    });
</script>

</body>
</html>
