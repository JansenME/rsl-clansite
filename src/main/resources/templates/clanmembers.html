<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
	<head>
		<title>Clanmembers</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" th:href="@{/styles/css/main.css}" />
		<script th:src="@{/styles/js/main.js}"></script>
	</head>
	<body>
		<div id="page-wrapper">
			<section id="header">
				<div th:insert="~{inserts/nav :: nav}" class="container">
				</div>
			</section>

			<section id="content">
				<div class="container">
					<section>
						<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
							<h2>Clanmembers</h2>

							<div sec:authorize="hasAnyRole('ADMIN', 'COORDINATOR')">
								<a th:href="@{/clanmembers/add}">Add new Clanmember</a>
							</div>
						</div>

						<table th:style="${#authorization.expression('isAuthenticated()')} ? 'width: 100%;' : 'width: 50%; margin: 0 auto;'">
							<thead>
								<tr>
									<th sec:authorize="isAuthenticated()"></th>
									<th sec:authorize="isAuthenticated()">Discord Name</th>
									<th sec:authorize="isAuthenticated()">Discord Nickname</th>
									<th>In-Game Name</th>
									<th>Clan Rank</th>
									<th sec:authorize="isAuthenticated()">Champion Count</th>
									<th sec:authorize="hasAnyRole('ADMIN', 'COORDINATOR')">Actions</th>
								</tr>
							</thead>

							<tbody>
							<tr th:each="member : ${clanmembers}">
								<td sec:authorize="isAuthenticated()">
									<div th:if="${member.discordId != null and member.avatarHash != null}">
										<img th:src="'https://cdn.discordapp.com/avatars/' + ${member.discordId} + '/' + ${member.avatarHash} + '.png'"
											 alt="Avatar"
											 style="width: 30px; height: 30px; border-radius: 50%; object-fit: cover;" />
									</div>
								</td>

								<td sec:authorize="isAuthenticated()" th:text="${member.discordName}">Global Name</td>
								<td sec:authorize="isAuthenticated()" th:text="${member.playerNickname}">Server Nickname</td> <td th:text="${member.ingameName}">In-Game Name</td>
								<td th:text="${member.clanRank != null ? T(com.rsl.clansite.model.enums.ClanRank).valueOf(member.clanRank).getName() : 'Unknown'}">Rank</td>
								<td sec:authorize="isAuthenticated()" th:text="${member.champions != null ? member.champions.size() : 0}">0</td>

								<td sec:authorize="hasAnyRole('ADMIN', 'COORDINATOR')">
									<form th:action="@{/clanmembers/{id}/delete(id=${member.id})}" method="POST"
										  onsubmit="return confirm('Are you sure you want to delete ' + [[${member.ingameName}]] + '?');">
										<button type="submit" style="background: #cc0000; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">
											Delete
										</button>
									</form>
								</td>
							</tr>
							</tbody>
						</table>

						<div th:if="${clanmembers.isEmpty()}">
							<p>The roster is currently empty. Please log in with a Coordinator account to manually populate the initial list.</p>
						</div>
					</section>
				</div>
			</section>

			<div th:insert="~{inserts/copyright :: copyright}" id="copyright">
			</div>
		</div>
	</body>
</html>
