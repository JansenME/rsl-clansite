<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{inserts/head :: head(pageTitle='Siege Team Builder')}">
</head>
<body>
<div id="page-wrapper">
    <section id="header">
        <div th:insert="~{inserts/nav :: nav}" class="container">
        </div>
    </section>

    <div class="container" th:if="${errorMessage}" style="margin: 10px auto; max-width: 1200px;">
        <div class="alert alert-danger">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
        </div>
    </div>

    <div id="team-sticky-header">
        <form id="team-form" th:action="@{/teams/save}" th:object="${newTeam}" method="POST" class="builder-container">

            <input type="hidden" th:field="*{id}" />

            <input type="hidden" name="targetMemberId" th:value="${targetMemberId}" />

            <div class="team-meta-inputs">
                <input type="text" th:field="*{teamName}" placeholder="Team Name (e.g. Speed Farm)" required />

                <select th:field="*{siegeConditionId}" id="siege-condition-selector" onchange="applyConditionFilter()">
                    <option value="" data-category="NONE">-- No Condition (General) --</option>
                    <option th:each="item : ${siegeConditions}"
                            th:value="${item.id}"
                            th:text="${item.label}"
                            th:data-category="${item.category}"
                            th:data-value="${item.value}">
                        Condition
                    </option>
                </select>

                <div id="leader-aura-display">
                    <i class="fas fa-bolt" style="color: #f1c40f;"></i>
                    <span id="aura-info-text">Leader Aura</span>
                </div>

                <div id="aura-warning">
                    <i class="fas fa-exclamation-triangle"></i> <span id="aura-msg">Warning text</span>
                </div>

                <div id="condition-warning">
                    <i class="fas fa-ban"></i> Invalid Champions for Condition!
                </div>
            </div>

            <div class="team-slots-wrapper">
                <div class="team-slot leader-slot" id="slot-0" onclick="handleSlotClick(0)">
                    <img id="img-0" src="/images/leader-image.png" alt="Leader" />
                    <input type="hidden" th:field="*{leaderChampionId}" id="input-0" />
                    <div class="slot-clear-btn" onclick="clearSlot(0, event)"><i class="fas fa-times"></i></div>
                </div>
                <div class="team-slot" id="slot-1" onclick="handleSlotClick(1)">
                    <img id="img-1" src="/images/teammember-image.png" alt="Member" />
                    <input type="hidden" th:field="*{champion2Id}" id="input-1" />
                    <div class="slot-clear-btn" onclick="clearSlot(1, event)"><i class="fas fa-times"></i></div>
                </div>
                <div class="team-slot" id="slot-2" onclick="handleSlotClick(2)">
                    <img id="img-2" src="/images/teammember-image.png" alt="Member" />
                    <input type="hidden" th:field="*{champion3Id}" id="input-2" />
                    <div class="slot-clear-btn" onclick="clearSlot(2, event)"><i class="fas fa-times"></i></div>
                </div>
                <div class="team-slot" id="slot-3" onclick="handleSlotClick(3)">
                    <img id="img-3" src="/images/teammember-image.png" alt="Member" />
                    <input type="hidden" th:field="*{champion4Id}" id="input-3" />
                    <div class="slot-clear-btn" onclick="clearSlot(3, event)"><i class="fas fa-times"></i></div>
                </div>
            </div>

            <button type="submit" class="save-btn" id="save-btn">Save Team</button>
        </form>
    </div>

    <section id="content">
        <div class="container roster-selection-area">
            <h2 style="text-align: center; margin-bottom: 20px;">Select Champions for Siege Defense</h2>

            <div th:if="${#lists.isEmpty(championOptions)}" style="text-align: center;">
                <p>You have no champions in your roster yet. Go to <a th:href="@{/champions}">My Roster</a> to add some!</p>
            </div>

            <div id="champion-grid-container" th:unless="${#lists.isEmpty(championOptions)}" style="display: flex; flex-wrap: wrap; gap: 15px; justify-content: center;">

                <th:block th:each="option : ${championOptions}">
                    <div class="roster-card custom-card builder-champion-card"
                         style="width: 120px; position: relative; margin-bottom: 10px; cursor: pointer;"
                         th:id="'roster-card-' + ${option.id}"
                         th:data-id="${option.id}"
                         th:data-img="${option.imageName}"
                         th:data-aura="${option.auraLoc}"
                         th:data-aura-desc="${option.auraDesc}"
                         th:data-faction="${option.faction}"
                         th:data-rarity="${option.rarity}"
                         th:data-type="${option.type}"
                         th:data-affinity="${option.affinity}">

                        <div class="image-container" style="position: relative; width: 100%; height: 120px; border-radius: 8px; overflow: hidden; border: 2px solid #444;">
                            <img th:src="${option.imageName != null and !#strings.isEmpty(option.imageName)} ? @{/images/champion-cards/{name}(name=${option.imageName})} : @{/images/champion-cards/placeholder.png}"
                                 style="width: 100%; height: 100%; object-fit: cover;" />

                            <div th:if="${option.affinity != ''}" style="position: absolute; bottom: 3px; left: 3px; width: 20px; height: 20px; z-index: 5;">
                                <img th:src="@{/images/affinity/{name}.png(name=${#strings.toLowerCase(option.affinity)})}"
                                     onerror="this.style.display='none'"
                                     style="width: 100%;" />
                            </div>

                            <div class="rank-badge">
                                <i class="fas fa-star" style="color: #f1c40f; margin-right: 2px;"></i>
                                <span th:text="${option.rank}">6</span>
                            </div>

                            <div class="level-badge" th:text="${option.level}">60</div>

                            <div class="pick-overlay">
                                <i class="fas fa-check"></i>
                            </div>
                        </div>

                        <div style="text-align: center; font-size: 0.8em; margin-top: 5px; line-height: 1.2; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"
                             th:text="${option.label}">Name</div>
                    </div>
                </th:block>

            </div>
        </div>
    </section>

    <div th:insert="~{inserts/copyright :: copyright}" id="copyright"></div>
</div>

<style>
    .rank-badge {
       position: absolute;
       top: 3px; left: 3px;
       background: rgba(0,0,0,0.8);
       color: white;
       font-size: 0.8em;
       padding: 1px 4px;
       border-radius: 4px;
       z-index: 10;
       font-weight: bold;
    }

    .level-badge {
       position: absolute;
       bottom: 3px; right: 3px;
       background: rgba(0,0,0,0.8);
       color: white;
       font-size: 0.9em;
       padding: 1px 4px;
       border-radius: 4px;
       z-index: 10;
       font-weight: bold;
       border: 1px solid #666;
    }

    .builder-champion-card.filtered-out {
        opacity: 0.2;
        pointer-events: none;
    }

    .builder-champion-card.picked .image-container {
        border-color: #2ecc71 !important;
        box-shadow: 0 0 10px rgba(46, 204, 113, 0.5);
    }

    .pick-overlay {
       position: absolute;
       top: 0; left: 0; width: 100%; height: 100%;
       background: rgba(46, 204, 113, 0.3);
       display: flex;
       align-items: center; justify-content: center;
       color: white;
       font-size: 2em;
       opacity: 0;
       transition: opacity 0.2s;
       z-index: 20;
    }

    .builder-champion-card:hover .pick-overlay {
        opacity: 1;
    }

    .builder-champion-card.picked .pick-overlay {
        opacity: 1;
        background: rgba(46, 204, 113, 0.6);
    }
</style>

<script>
    console.log("TEAM BUILDER SCRIPT STARTING...");

    let selectedSlotIndex = null;
    const LEADER_PLACEHOLDER = '/images/leader-image.png';
    const MEMBER_PLACEHOLDER = '/images/teammember-image.png';

    document.addEventListener("DOMContentLoaded", function() {
        console.log("Checking for existing team data...");

        for (let i = 0; i < 4; i++) {
            const input = document.getElementById(`input-${i}`);
            if (input && input.value) {
                const champId = input.value;
                const cardDiv = document.getElementById(`roster-card-${champId}`);

                if (cardDiv) {
                    const imgName = cardDiv.getAttribute('data-img');
                    const auraLoc = cardDiv.getAttribute('data-aura');
                    const auraDesc = cardDiv.getAttribute('data-aura-desc');

                    let fullImgUrl = '/images/champion-cards/placeholder.png';
                    if (imgName && imgName !== 'null' && imgName !== '') {
                        fullImgUrl = `/images/champion-cards/${imgName}`;
                    }

                    fillSlot(i, champId, fullImgUrl, auraLoc, auraDesc);
                    cardDiv.classList.add('picked');
                }
            }
        }

        applyConditionFilter();
    });

    function applyConditionFilter() {
        const selector = document.getElementById('siege-condition-selector');
        const selectedOption = selector.options[selector.selectedIndex];

        const category = selectedOption.getAttribute('data-category');
        const conditionValue = selectedOption.getAttribute('data-value');

        const allCards = document.querySelectorAll('.builder-champion-card');
        let hasInvalidSlot = false;

        allCards.forEach(card => {
            if (!category || category === 'NONE') {
                card.classList.remove('filtered-out');
            } else {
                let cardValue = '';
                if (category === 'FACTION') cardValue = card.getAttribute('data-faction');
                if (category === 'RARITY') cardValue = card.getAttribute('data-rarity');
                if (category === 'TYPE') cardValue = card.getAttribute('data-type');
                if (category === 'AFFINITY') cardValue = card.getAttribute('data-affinity');

                if (cardValue === conditionValue) {
                    card.classList.remove('filtered-out');
                } else {
                    card.classList.add('filtered-out');
                }
            }
        });

        for (let i = 0; i < 4; i++) {
            const input = document.getElementById(`input-${i}`);
            const slotDiv = document.getElementById(`slot-${i}`);

            if (input && input.value) {
                const champId = input.value;
                const rosterCard = document.getElementById(`roster-card-${champId}`);

                if (rosterCard) {
                    if (category && category !== 'NONE') {
                        let cardValue = '';
                        if (category === 'FACTION') cardValue = rosterCard.getAttribute('data-faction');
                        if (category === 'RARITY') cardValue = rosterCard.getAttribute('data-rarity');
                        if (category === 'TYPE') cardValue = rosterCard.getAttribute('data-type');
                        if (category === 'AFFINITY') cardValue = rosterCard.getAttribute('data-affinity');

                        if (cardValue !== conditionValue) {
                            slotDiv.classList.add('invalid-slot');
                            hasInvalidSlot = true;
                        } else {
                            slotDiv.classList.remove('invalid-slot');
                        }
                    } else {
                        slotDiv.classList.remove('invalid-slot');
                    }
                }
            } else {
                slotDiv.classList.remove('invalid-slot');
            }
        }

        const saveBtn = document.getElementById('save-btn');
        const warnDiv = document.getElementById('condition-warning');

        if (hasInvalidSlot) {
            saveBtn.disabled = true;
            warnDiv.style.display = 'block';
        } else {
            saveBtn.disabled = false;
            warnDiv.style.display = 'none';
        }
    }

    document.addEventListener("click", function(e) {
        const cardDiv = e.target.closest('.builder-champion-card');
        const grid = document.getElementById('champion-grid-container');

        if (cardDiv && grid && grid.contains(cardDiv)) {
            pickChampion(cardDiv);
        }
    });

    function handleSlotClick(index) {
        const slotDiv = document.getElementById(`slot-${index}`);

        if (selectedSlotIndex === index) {
            deselectAll();
            return;
        }
        if (selectedSlotIndex !== null) {
            swapSlots(selectedSlotIndex, index);
            deselectAll();
            return;
        }
        deselectAll();
        selectedSlotIndex = index;
        slotDiv.classList.add('selected');
    }

    function pickChampion(cardDiv) {
        const champId = cardDiv.getAttribute('data-id');
        const imgName = cardDiv.getAttribute('data-img');
        const auraLoc = cardDiv.getAttribute('data-aura');
        const auraDesc = cardDiv.getAttribute('data-aura-desc');

        let fullImgUrl = '/images/champion-cards/placeholder.png';
        if (imgName && imgName !== 'null' && imgName !== '') {
            fullImgUrl = `/images/champion-cards/${imgName}`;
        }

        let targetIndex = -1;
        if (selectedSlotIndex !== null) {
            targetIndex = selectedSlotIndex;
        } else {
            for (let i = 0; i < 4; i++) {
                const inputVal = document.getElementById(`input-${i}`).value;
                if (!inputVal) {
                    targetIndex = i;
                    break;
                }
            }
        }

        if (targetIndex === -1) {
            alert("Team is full! Please select a slot to replace, or clear a slot first.");
            return;
        }

        const selector = document.getElementById('siege-condition-selector');
        const selectedOption = selector.options[selector.selectedIndex];
        const category = selectedOption.getAttribute('data-category');
        const conditionValue = selectedOption.getAttribute('data-value');

        if (category && category !== 'NONE') {
             let cardValue = '';
             if (category === 'FACTION') cardValue = cardDiv.getAttribute('data-faction');
             if (category === 'RARITY') cardValue = cardDiv.getAttribute('data-rarity');
             if (category === 'TYPE') cardValue = cardDiv.getAttribute('data-type');
             if (category === 'AFFINITY') cardValue = cardDiv.getAttribute('data-affinity');

             if (cardValue !== conditionValue) {
                 alert("This champion does not match the selected Siege Condition!");
                 return;
             }
        }

        const currentInput = document.getElementById(`input-${targetIndex}`);
        if (currentInput.value) {
            const oldId = currentInput.value;
            const oldCard = document.getElementById(`roster-card-${oldId}`);
            if (oldCard) {
                oldCard.classList.remove('picked');
            }
        }

        fillSlot(targetIndex, champId, fullImgUrl, auraLoc, auraDesc);
        deselectAll();
        cardDiv.classList.add('picked');

        applyConditionFilter();
    }

    function fillSlot(index, id, imgUrl, auraLoc, auraDesc) {
        document.getElementById(`input-${index}`).value = id;
        document.getElementById(`img-${index}`).src = imgUrl;

        const slotDiv = document.getElementById(`slot-${index}`);
        slotDiv.setAttribute('data-aura', auraLoc);
        slotDiv.setAttribute('data-aura-desc', auraDesc);

        slotDiv.classList.add('has-champion');
        if (index === 0) checkLeaderAura(auraLoc, auraDesc);
    }

    function clearSlot(index, event) {
        if (event) event.stopPropagation();

        const oldId = document.getElementById(`input-${index}`).value;
        if (oldId) {
            const rosterCard = document.getElementById(`roster-card-${oldId}`);
            if (rosterCard) rosterCard.classList.remove('picked');
        }

        document.getElementById(`input-${index}`).value = '';
        document.getElementById(`img-${index}`).src = (index === 0) ? LEADER_PLACEHOLDER : MEMBER_PLACEHOLDER;

        const slotDiv = document.getElementById(`slot-${index}`);
        slotDiv.removeAttribute('data-aura');
        slotDiv.removeAttribute('data-aura-desc');
        slotDiv.classList.remove('has-champion');
        slotDiv.classList.remove('invalid-slot');

        if (index === 0) hideAuraInfo();
        if (selectedSlotIndex === index) deselectAll();

        applyConditionFilter();
    }

    function swapSlots(indexA, indexB) {
        const idA = document.getElementById(`input-${indexA}`).value;
        const imgA = document.getElementById(`img-${indexA}`).src;
        const slotA = document.getElementById(`slot-${indexA}`);
        const auraA = slotA.getAttribute('data-aura');
        const auraDescA = slotA.getAttribute('data-aura-desc');
        const hasA = !!idA;

        const idB = document.getElementById(`input-${indexB}`).value;
        const imgB = document.getElementById(`img-${indexB}`).src;
        const slotB = document.getElementById(`slot-${indexB}`);
        const auraB = slotB.getAttribute('data-aura');
        const auraDescB = slotB.getAttribute('data-aura-desc');
        const hasB = !!idB;

        if (hasA) fillSlot(indexB, idA, imgA, auraA, auraDescA);
        else clearSlot(indexB);

        if (hasB) fillSlot(indexA, idB, imgB, auraB, auraDescB);
        else clearSlot(indexA);

        const newLeaderSlot = document.getElementById(`slot-0`);
        const newLeaderAura = newLeaderSlot.getAttribute('data-aura');
        const newLeaderDesc = newLeaderSlot.getAttribute('data-aura-desc');
        checkLeaderAura(newLeaderAura, newLeaderDesc);

        applyConditionFilter();
    }

    function deselectAll() {
        selectedSlotIndex = null;
        document.querySelectorAll('.team-slot').forEach(el => el.classList.remove('selected'));
    }

    function checkLeaderAura(auraLoc, auraDesc) {
        const warningDiv = document.getElementById('aura-warning');
        const warningText = document.getElementById('aura-msg');
        const infoDiv = document.getElementById('leader-aura-display');
        const infoText = document.getElementById('aura-info-text');

        const leaderId = document.getElementById('input-0').value;

        if (!leaderId) {
            hideAuraInfo();
            return;
        }

        if (auraDesc && auraDesc !== 'No Aura') {
            infoDiv.style.display = 'flex';
            infoText.innerText = auraDesc;
        } else {
            infoDiv.style.display = 'none';
        }

        if (!auraLoc || auraLoc === 'NONE') {
            warningDiv.style.display = 'block';
            warningText.innerText = 'Leader has no Aura.';
            infoDiv.style.display = 'none';
            return;
        }

        if (auraLoc !== 'ALL_BATTLES') {
            warningDiv.style.display = 'block';
            warningText.innerText = "Warning: Only 'All Battles' Auras work in Siege.";
        } else {
            warningDiv.style.display = 'none';
        }
    }

    function hideAuraInfo() {
        document.getElementById('aura-warning').style.display = 'none';
        document.getElementById('leader-aura-display').style.display = 'none';
    }
</script>
</body>
</html>
