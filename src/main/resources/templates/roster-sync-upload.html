<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{inserts/head :: head(pageTitle='Roster Sync')}">
</head>
<body>
<div id="page-wrapper">
	<section id="header">
		<div th:insert="~{inserts/nav :: nav}" class="container">
		</div>
	</section>

	<section id="content">
		<div class="container">

			<div th:if="${errorMessage}" class="col-12">
				<div class="alert alert-danger" style="background: #ffe6e6; border: 1px solid #ffcccc; padding: 15px; margin-bottom: 20px; border-radius: 4px; color: #a94442;">
					<i class="fa fa-exclamation-triangle"></i> <span th:text="${errorMessage}">Error</span>
				</div>
			</div>

			<div th:if="${resumeAvailable}" class="col-12" style="margin-bottom: 30px;">
				<div style="background: #e3f2fd; border: 1px solid #bbdefb; padding: 20px; border-radius: 5px; display: flex; align-items: center; justify-content: space-between;">
					<div>
						<h3 style="margin: 0 0 5px 0; color: #0d47a1;">Unfinished Sync Found</h3>
						<p style="margin: 0; color: #555;">
							You uploaded a file on <strong th:text="${#temporals.format(fileLastModified, 'dd-MM-yyyy HH:mm')}">Date</strong> but didn't finish.
						</p>
					</div>
					<div>
						<a th:href="@{/sync/preview}" class="button icon solid fa-arrow-right" style="background-color: #2196f3; color: white;">Resume Sync</a>
					</div>
				</div>
			</div>

			<section sec:authorize="isAuthenticated()">
				<div class="container">
					<div style="background: #f0f8ff; border: 2px solid #4a90e2; padding: 25px; border-radius: 8px; text-align: center;">
						<h3 style="margin: 0 0 15px 0; color: #2c5282;">
							<i class="fa fa-rocket"></i> New: Automatic Sync
						</h3>
						<p style="margin: 0 0 20px 0; color: #555;">
							Launch the KloepieBot app to automatically sync your champions directly—no CSV upload needed!
						</p>
						<button id="launchAppBtn" class="button primary icon solid fa-play" style="background-color: #4a90e2;">
							Launch Sync App
						</button>
						<div id="launchStatus" style="margin-top: 15px; font-size: 0.9em; color: #666;"></div>
					</div>
				</div>

				<script>
					let syncPopup = null;

                    // Listen for message from popup
                    window.addEventListener('message', (event) => {
                        if (event.data === 'upload_complete') {
                            // Close the waiting popup if still open
                            if (syncPopup && !syncPopup.closed) {
                                syncPopup.close();
                            }
                            window.location.href = '/sync/preview';
                        }
                    });

                    // Also listen via BroadcastChannel (backup)
                    try {
                        const channel = new BroadcastChannel('kloepiebot_sync');
                        channel.addEventListener('message', (event) => {
                            if (event.data === 'upload_complete') {
                                // Close the waiting popup if still open
                                if (syncPopup && !syncPopup.closed) {
                                    syncPopup.close();
                                }
                                window.location.href = '/sync/preview';
                            }
                        });
                    } catch(e) {
                        // BroadcastChannel not supported
                    }

                    // Button click handler
                    document.getElementById('launchAppBtn').addEventListener('click', function() {
                        const btn = this;
                        btn.disabled = true;

                        // Simple popup that just waits (no polling)
                        syncPopup = window.open('', 'KloepieBotSync', 'width=400,height=300,top=100,left=100');
                        syncPopup.document.write(`
                            <!DOCTYPE html>
                            <html>
                            <head>
                                <title>KloepieBot - Waiting</title>
                                <style>
                                    body {
                                        font-family: Arial, sans-serif;
                                        text-align: center;
                                        padding: 40px 20px;
                                        background: #1a1a2e;
                                        color: #eee;
                                    }
                                    .spinner {
                                        border: 4px solid #f3f3f3;
                                        border-top: 4px solid #4a90e2;
                                        border-radius: 50%;
                                        width: 40px;
                                        height: 40px;
                                        animation: spin 1s linear infinite;
                                        margin: 20px auto;
                                    }
                                    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
                                    h2 { color: #4a90e2; margin-bottom: 10px; }
                                    p { margin: 10px 0; }
                                    .hint { font-size: 0.85em; color: #888; margin-top: 30px; }
                                </style>
                            </head>
                            <body>
                                <h2>🎮 KloepieBot is Open</h2>
                                <div class="spinner"></div>
                                <p>Waiting for you to upload your data...</p>
                                <p class="hint">This window will close automatically after upload.</p>
                            </body>
                            </html>
                        `);

                        // Fetch token and launch app
                        fetch('/api/app/token/generate', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'same-origin'
                        })
                        .then(response => response.json())
                        .then(data => {
                            if (data.success) {
                                // Launch app via hidden iframe
                                const iframe = document.createElement('iframe');
                                iframe.style.display = 'none';
                                iframe.src = data.launchUrl;
                                document.body.appendChild(iframe);

                                // Popup stays open, waiting for app to signal completion
                                // No polling needed - message event will handle redirect

                            } else {
                                syncPopup.close();
                                alert('Failed to generate token: ' + data.message);
                                btn.disabled = false;
                            }
                        })
                        .catch(error => {
                            syncPopup.close();
                            alert('Error: ' + error.message);
                            btn.disabled = false;
                        });
                    });
				</script>
			</section>

		</div>
	</section>

	<div th:insert="~{inserts/copyright :: copyright}" id="copyright">
