<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<title>Profile</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<link rel="stylesheet" th:href="@{/styles/css/main.css}" />
	<script th:src="@{/styles/js/main.js}"></script>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body>
<div id="page-wrapper">
	<section id="header">
		<div th:insert="~{inserts/nav :: nav}" class="container">
		</div>
	</section>

	<section id="content">
		<div class="container">
			<section>

				<div style="display: flex; flex-wrap: wrap; justify-content: space-between; text-align: left;">

					<div style="flex: 1; min-width: 300px;">
						<h2>
							<span th:text="${isOwnProfile ? 'My Profile & Roles' : 'Member Profile'}">Profile</span>
						</h2>

						<div sec:authorize="isAuthenticated()">
							<div style="display: flex; align-items: flex-start; margin-bottom: 20px;">

								<div th:if="${clanmemberViewData != null and clanmemberViewData.discordAvatarUrl != null}" style="margin-right: 15px;">
									<img th:src="${clanmemberViewData.discordAvatarUrl}"
										 alt="Discord Avatar"
										 style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover;" />
								</div>
								<div style="margin-left: 0; padding-left: 0;"><p style="margin: 0 0 10px 0; padding-left: 0;"><span th:text="${isOwnProfile ? 'Logged in as:' : 'Member:'}">User:</span><br /><strong th:text="${clanmemberViewData != null ? clanmemberViewData.discordUserName : 'User'}" style="margin-left: 0 !important; display: inline-block !important;">Discord User Name</strong>
									</p>

									<p style="font-weight: bold; margin-bottom: 5px; margin-left: 0; padding-left: 0;">Roles:</p>

									<ul style="list-style: disc; margin-left: 20px; padding: 0; text-align: left;"
										th:if="${clanmemberViewData != null}">
										<li th:each="discordUserRole : ${clanmemberViewData.discordUserRoles}">
											<span th:text="${discordUserRole}">Role Name</span>
										</li>
									</ul>
								</div>
							</div>

							<div th:if="${isOwnProfile and linkedMembers != null and #lists.size(linkedMembers) > 1}"
								 style="margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px;">

								<h3>Linked Game Accounts</h3><p style="font-size: 0.9em; color: #666; margin-bottom: 1em;">Currently acting as: <strong style="color: #27ae60;" th:text="${activeMember != null ? activeMember.ingameName : 'Unknown'}">Name</strong>
								</p>

								<div class="table-wrapper">
									<table class="alt">
										<thead>
										<tr>
											<th>In-Game Name</th>
											<th>Clan</th>
											<th>Rank</th>
											<th style="text-align: center;">Status</th>
										</tr>
										</thead>
										<tbody>
										<tr th:each="linked : ${linkedMembers}">
											<td th:text="${linked.ingameName}" style="font-weight: bold;">Name</td>
											<td>
                                              <span th:if="${linked.clanGroup != null}"
													th:text="${linked.clanGroup}"
													style="background: #eee; padding: 2px 6px; border-radius: 4px; font-size: 0.8em;">T1</span>
												<span th:if="${linked.clanGroup == null}">-</span>
											</td>
											<td th:text="${linked.clanRank}">Soldier</td>

											<td style="text-align: center;">
												<div th:if="${activeMember != null and linked.id == activeMember.id}">
                                                  <span style="color: #27ae60; font-weight: bold; font-size: 0.9em;">
                                                      <i class="fas fa-check-circle"></i> Active
                                                  </span>
												</div>

												<div th:if="${activeMember == null or linked.id != activeMember.id}">
													<form th:action="@{/profile/switch}" method="post" style="margin: 0;">
														<input type="hidden" name="memberId" th:value="${linked.id}" />
														<button type="submit" class="button small" style="padding: 0 10px; height: 30px; line-height: 30px;">
															Switch
														</button>
													</form>
												</div>
											</td>
										</tr>
										</tbody>
									</table>
								</div>
							</div>
						</div>

						<div sec:authorize="isAnonymous()">
							<p>Please <a th:href="@{/oauth2/authorization/discord}">log in</a> to view your profile.</p>
						</div>
					</div>

					<div th:if="${isOwnProfile}"
						 style="width: 250px; border-left: 1px solid #eee; padding-left: 30px; margin-left: 20px;">
						<h2 style="font-size: 1.4em;">Quick Links</h2>
						<ul style="list-style: none; padding: 0; margin: 0;">

							<li th:each="link : ${quickLinks}" style="margin-bottom: 10px;">
								<a th:href="@{${link.url}}"
								   th:text="${link.label}"
								   class="button small fit"
								   style="display: block; width: 100%; text-align: center;">
									Link Name
								</a>
							</li>

							<li style="margin-bottom: 10px;">
								<form th:action="@{/perform_logout}" method="post" style="margin: 0;">
									<button type="submit" class="button small fit" style="display: block; width: 100%; text-align: center;">Logout</button>
								</form>
							</li>
						</ul>
					</div>

				</div>
			</section>
		</div>
	</section>

	<div th:insert="~{inserts/copyright :: copyright}" id="copyright">
	</div>
</div>
</body>
</html>
