<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="card(champion, ownedChampionIds)"
     class="champion-card card-hidden"
     th:id="'card-' + ${champion.id}"
     th:classappend="${ownedChampionIds != null and #lists.contains(ownedChampionIds, champion.id)} ? 'selected' : ''"
     th:data-id="${champion.id}"
     th:data-rarity="${champion.rarity != null ? champion.rarity.getName() : ''}"
     th:data-type="${champion.type != null ? champion.type.getName() : ''}"
     th:data-affinity="${champion.affinity != null ? champion.affinity.getName() : ''}"
     th:data-faction="${champion.faction != null ? champion.faction.getName() : ''}"
     th:data-alliance="${champion.faction != null and champion.faction.alliance != null ? champion.faction.alliance.getName() : ''}"
     th:data-name="${champion.name}"
     th:data-score="${champion.arenaScore}"
     onclick="if(typeof handleCardClick === 'function') handleCardClick(this.getAttribute('data-id'))">

    <div class="champion-image-wrapper">
        <a th:href="@{/champions/{id}(id=${champion.id})}" style="text-decoration: none; border-bottom: none;">
            <img th:src="${champion.imagename != null and !#strings.isEmpty(champion.imagename)} ? @{/images/champion-cards/{name}(name=${champion.imagename})} : @{/images/champion-cards/placeholder.png}"
                 alt="Champion Image"
                 style="width:140px;"
                 class="champion-portrait"
                 th:classappend="${champion.rarity != null} ? 'rarity-border-' + ${#strings.toLowerCase(champion.rarity)} : ''"
                 loading="lazy"
                 decoding="async" />
        </a>

        <div class="affinity-overlay" th:if="${champion.affinity != null}">
            <img th:src="@{/images/affinity/{name}.png(name=${champion.affinity})}"
                 onerror="this.style.display='none'"
                 alt="Affinity" />
        </div>
    </div>

    <div class="champion-rating-placeholder"></div>
    <p class="champion-name" th:text="${champion.name}"></p>
</div>

</body>
</html>
