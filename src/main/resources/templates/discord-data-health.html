<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Data Health Dashboard</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" th:href="@{/styles/css/main.css}" />
    <script th:src="@{/styles/js/main.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body>
<div id="page-wrapper">
    <section id="header">
        <div th:insert="~{inserts/nav :: nav}" class="container"></div>
    </section>

    <section id="content">
        <div class="container">
            <section>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>Data Health & Sync Dashboard</h2>
                    <a th:href="@{/clanmembers}" class="button alt">
                        <i class="fas fa-arrow-left"></i> Back to Roster
                    </a>
                </div>

                <div th:if="${successMessage}" class="alert alert-success">
                    <i class="fas fa-check-circle"></i> <span th:text="${successMessage}"></span>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger">
                    <i class="fas fa-exclamation-triangle"></i> <span th:text="${errorMessage}"></span>
                </div>

                <div class="card">
                    <div class="card-header">
                        <i class="fab fa-discord"></i> Discord Consistency Check
                    </div>

                    <div style="padding: 0;">
                        <table style="width: 100%; border-collapse: collapse; margin: 0; border-radius: 0; box-shadow: none;">
                            <thead>
                            <tr>
                                <th style="text-align: left;">Discord Identity</th>
                                <th style="text-align: center;">Avatar</th>
                                <th style="text-align: center;">Roles</th>
                                <th style="text-align: left;">Nickname Sync</th>
                                <th style="text-align: right; padding-right: 20px;">Action</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="row : ${statusList}" style="border-bottom: 1px solid #eee;">

                                <td data-label="Discord Identity">
                                    <span th:text="${row.discordName}"
                                          th:classappend="${row.discordName == 'NOT FOUND' or row.discordName == 'Unknown'} ? 'text-danger' : ''"
                                          style="font-weight: bold;">
                                        Discord Name
                                    </span>

                                    <div class="text-muted" th:text="${row.discordId}">ID</div>
                                    <div th:if="${row.statusMessage}" class="text-danger" style="font-size: 0.75rem;" th:text="${row.statusMessage}">Error</div>
                                </td>

                                <td data-label="Avatar" style="text-align: center;">
                                    <span th:if="${row.avatarSynced}" class="status-ok"><i class="fas fa-check"></i></span>
                                    <span th:unless="${row.avatarSynced}" class="status-bad"><i class="fas fa-times"></i></span>
                                </td>

                                <td data-label="Roles" style="text-align: center;">
                                    <span th:if="${row.rolesSynced}" class="status-ok"><i class="fas fa-check"></i></span>
                                    <span th:unless="${row.rolesSynced}" class="status-bad"><i class="fas fa-times"></i></span>
                                </td>

                                <td data-label="Nickname Sync">
                                    <div th:if="${row.nicknameSynced}" class="status-ok">
                                        <i class="fas fa-check"></i> Synced
                                    </div>
                                    <div th:unless="${row.nicknameSynced}">
                                        <span class="status-bad"><i class="fas fa-times"></i> Mismatch</span>
                                        <div class="text-muted">DB value differs</div>
                                    </div>
                                </td>

                                <td data-label="Action" style="text-align: right; padding-right: 20px;">

                                    <div th:if="${#strings.isEmpty(row.discordId)}">
                                        <span class="text-muted" style="font-style: italic;">No Discord ID</span>
                                    </div>

                                    <div th:if="${!#strings.isEmpty(row.discordId) and (!row.avatarSynced or !row.rolesSynced or !row.nicknameSynced)}">
                                        <form th:action="@{/clanmembers/admin/sync/{id}(id=${row.memberId})}" method="post" style="margin: 0;">
                                            <button type="submit" class="button small primary" title="Force update from Discord">
                                                <i class="fas fa-sync"></i> Sync
                                            </button>
                                        </form>
                                    </div>

                                    <div th:if="${!#strings.isEmpty(row.discordId) and row.avatarSynced and row.rolesSynced and row.nicknameSynced}">
                                         <span class="status-ok" title="Data matches Discord perfectly">
                                            <i class="fas fa-check-circle"></i> Synced
                                         </span>
                                    </div>

                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </section>

    <div th:insert="~{inserts/copyright :: copyright}" id="copyright"></div>
</div>
</body>
</html>
