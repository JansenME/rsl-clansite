<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Clanmember</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" th:href="@{/styles/css/main.css}" />
    <script th:src="@{/styles/js/main.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body>
<div id="page-wrapper">
    <section id="header">
        <div th:insert="~{inserts/nav :: nav}" class="container">
        </div>
    </section>

    <section id="content">
        <div class="container">
            <section>
                <div class="form-container">
                    <h2 style="text-align: center;">Edit Clanmember</h2>

                    <div th:replace="~{inserts/alerts :: error-box(${errorMessage})}"></div>

                    <form action="#"
                          th:action="@{/clanmembers/edit/{id}(id=${editingMemberId})}"
                          th:object="${clanmemberRosterDto}"
                          method="POST">

                        <input type="hidden" th:field="*{discordName}" />
                        <input type="hidden" th:field="*{playerNickname}" />
                        <input type="hidden" th:field="*{avatarHash}" />

                        <div th:if="${clanmemberRosterDto.discordId != null and !clanmemberRosterDto.discordId.isEmpty()}"
                             class="linked-account-box">

                            <h3 style="margin-top: 0; margin-bottom: 15px; font-size: 1.1em; color: #495057;">Current Linked Account</h3>

                            <div class="linked-account-info">
                                <div th:if="${clanmemberRosterDto.avatarHash != null}">
                                    <img th:src="'https://cdn.discordapp.com/avatars/' + ${clanmemberRosterDto.discordId} + '/' + ${clanmemberRosterDto.avatarHash} + '.png'"
                                         alt="Avatar" class="linked-avatar-img" />
                                </div>

                                <div>
                                    <div style="font-weight: bold; font-size: 1.0em;" th:text="${clanmemberRosterDto.discordName}">Global Name</div>
                                    <div style="font-size: 0.85em; color: #555;">
                                        Nickname: <span th:text="${clanmemberRosterDto.playerNickname}">Nick</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <h3 class="section-divider-title">Account Linking</h3>

                        <div class="form-group form-center-narrow" style="margin-bottom: 30px;">
                            <label for="discordId">Discord User ID:</label>
                            <input type="text" id="discordId" th:field="*{discordId}" style="font-family: monospace;" />
                        </div>

                        <h3 class="section-divider-title">Roster Details</h3>

                        <div class="form-group form-center-narrow">
                            <label for="ingameName">In-Game Name:</label>
                            <input type="text" id="ingameName" th:field="*{ingameName}" required />
                            <span th:if="${#fields.hasErrors('ingameName')}" th:errors="*{ingameName}" class="field-error">Error</span>
                        </div>

                        <div class="form-grid-2">
                            <div class="form-group">
                                <label for="clanRank">Clan Rank:</label>
                                <select id="clanRank" th:field="*{clanRank}" required>
                                    <option value="">-- Select Rank --</option>
                                    <option th:each="rank : ${clanRanks}"
                                            th:value="${rank}"
                                            th:text="${rank.getName()}">Rank Name</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="clanGroup">Clan Group:</label>
                                <select id="clanGroup" th:field="*{clanGroup}" required>
                                    <option value="">-- Select Clan --</option>
                                    <option th:each="group : ${T(com.rsl.clansite.model.enums.ClanGroup).values()}"
                                            th:value="${group}"
                                            th:text="${group.name}">Group Name</option>
                                </select>
                            </div>
                        </div>

                        <div style="margin-top: 30px; display: flex; justify-content: center; gap: 15px;">
                            <button type="submit" class="button primary">
                                <i class="fas fa-save"></i> <span>Update Member</span>
                            </button>
                            <a th:href="@{/clanmembers}" class="button alt">
                                <i class="fas fa-times"></i> <span>Cancel</span>
                            </a>
                        </div>
                    </form>
                </div>
            </section>
        </div>
    </section>

    <div th:insert="~{inserts/copyright :: copyright}" id="copyright">
    </div>
</div>
</body>
</html>
