<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{inserts/head :: head(pageTitle='Champions')}">
</head>
<body>
<div id="page-wrapper">
	<section id="header">
		<div th:insert="~{inserts/nav :: nav}" class="container">
		</div>
	</section>

	<section id="content">
		<div class="container">
			<section>

				<div th:if="${errorMessage != null}"
					 style="background-color: #e74c3c; color: white; padding: 15px; border-radius: 5px; margin-bottom: 20px; text-align: center;">
					<i class="fas fa-exclamation-triangle"></i> <span th:text="${errorMessage}">Error</span>
				</div>

				<div th:if="${dataHealth != null and !dataHealth.isHealthy}"
					 style="background-color: #e67e22; color: white; padding: 15px; border-radius: 5px; margin-bottom: 20px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
					<i class="fas fa-database"></i>
					<strong>Notice:</strong> The champion database is missing <strong th:text="${dataHealth.totalMissing}">X</strong> champions compared to known targets.
					<br/>
					<span style="font-size: 0.9em;">Please contact a Deputy or higher and tell them to do some work!</span>
				</div>

				<div style="text-align: center; margin-bottom: 20px;">
					<div style="font-size: 1.1em; margin-bottom: 15px;">
						Showing <strong id="visible-champion-count" th:text="${champions.size()}">0</strong> / <strong th:text="${amountOfChampions}">0</strong> Champions
					</div>

					<button type="button" onclick="toggleFilter()" class="button primary">
						<span id="filter-text">Show Filters & Sorting</span>
						<span id="filter-arrow">▼</span>
					</button>
				</div>

				<div id="filter-wrapper"
					 style="max-height: 0; opacity: 0; overflow: hidden; transition: all 0.5s ease-in-out; background: rgba(0,0,0,0.02); border-radius: 8px; border: 1px solid transparent; margin-bottom: 0; padding: 0 20px;">
					<form action="#"
						  th:action="@{/champions}"
						  th:object="${filtersWrapper}"
						  method="POST"
						  onsubmit="event.preventDefault(); return false;">

						<input type="button" onclick="checkAll(true)" value="Check all">
						<input type="button" onclick="checkAll(false)" value="Clear all">

						<label for="champion-sort">Sort by:</label>
						<select id="champion-sort" onchange="applyChampionFilters();">
							<option value="name_asc">Name (A-Z)</option>
							<option value="name_desc">Name (Z-A)</option>
							<option value="score_desc">Arena Score (High to Low)</option>
							<option value="score_asc">Arena Score (Low to High)</option>
						</select>

						<label for="champion-search" style="margin-left: 20px;">Search Name:</label>
						<input type="text"
							   id="champion-search"
							   placeholder="Search by Champion name..."
							   oninput="applyChampionFilters();"
							   style="width: 250px; padding: 4px;"
						/>

						<span sec:authorize="isAuthenticated()" style="margin-left: 20px; display: inline-flex; gap: 15px; align-items: center;">
                      <label style="cursor:pointer; display:flex; align-items:center; gap:5px;">
                         <input type="checkbox" id="filter-roster-owned" checked onchange="applyChampionFilters()">
                         Owned
                      </label>
                      <label style="cursor:pointer; display:flex; align-items:center; gap:5px;">
                         <input type="checkbox" id="filter-roster-unowned" checked onchange="applyChampionFilters()">
                         Unowned
                      </label>
                   </span>

						<table>
							<thead>
							<tr>
								<th>Rarity</th>
								<th>Type</th>
								<th>Affinity</th>
								<th>Faction</th>
								<th>Alliance</th>
							</tr>
							</thead>
							<tbody>
							<tr>
								<td data-label="Rarity" style="vertical-align: text-top; padding-top:10px;">
                                     <span th:each="item, stat : *{rarities}">
                                        <input type="checkbox" class="filter-checkbox filter-rarity" onchange="applyChampionFilters()" th:data-filter-name="${item.getName()}" th:field="*{rarities[__${stat.index}__].value}" />
                                        <span th:text="${item.getName()}"></span><br />
                                        <input type="hidden" th:field="*{rarities[__${stat.index}__].name}" />
                                     </span>
								</td>
								<td data-label="Type" style="vertical-align: text-top; padding-top:10px;">
                                     <span th:each="item, stat : *{types}">
                                        <input type="checkbox" class="filter-checkbox filter-type" onchange="applyChampionFilters()" th:data-filter-name="${item.getName()}" th:field="*{types[__${stat.index}__].value}" />
                                        <span th:text="${item.getName()}"></span><br />
                                        <input type="hidden" th:field="*{types[__${stat.index}__].name}" />
                                     </span>
								</td>
								<td data-label="Affinity" style="vertical-align: text-top; padding-top:10px;">
                                     <span th:each="item, stat : *{affinities}">
                                        <input type="checkbox" class="filter-checkbox filter-affinity" onchange="applyChampionFilters()" th:data-filter-name="${item.getName()}" th:field="*{affinities[__${stat.index}__].value}" />
                                        <span th:text="${item.getName()}"></span><br />
                                        <input type="hidden" th:field="*{affinities[__${stat.index}__].name}" />
                                     </span>
								</td>
								<td data-label="Faction" style="vertical-align: text-top; padding-top:10px;">
                                     <span th:each="item, stat : *{factions}">
                                        <input type="checkbox" class="filter-checkbox filter-faction" onchange="applyChampionFilters()" th:data-filter-name="${item.getName()}" th:field="*{factions[__${stat.index}__].value}" />
                                        <span th:text="${item.getName()}"></span><br />
                                        <input type="hidden" th:field="*{factions[__${stat.index}__].name}" />
                                     </span>
								</td>
								<td data-label="Alliance" style="vertical-align: text-top; padding-top:10px;">
                                     <span th:each="item, stat : *{alliances}">
                                        <input type="checkbox" class="filter-checkbox filter-alliance" onchange="applyChampionFilters()" th:data-filter-name="${item.getName()}" th:field="*{alliances[__${stat.index}__].value}" />
                                        <span th:text="${item.getName()}"></span><br />
                                        <input type="hidden" th:field="*{alliances[__${stat.index}__].name}" />
                                     </span>
								</td>
							</tr>
							</tbody>
						</table>
					</form>
				</div>
			</section>

			<section>
				<div style="text-align: left; margin-bottom: 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">

					<div sec:authorize="isAuthenticated()">
						<button type="button"
								id="roster-toggle-btn"
								class="button small primary"
								onclick="toggleRosterMode()">
							<i class="fas fa-edit"></i> <span th:text="${isManagementMode ? 'Edit Member Roster' : 'Edit Personal Roster'}">Edit Roster</span>
						</button>
					</div>

					<th:block sec:authorize="hasRole('OWNER')">
						<a th:href="@{/champions/new}" class="button small primary">
							<i class="fas fa-plus"></i> Add new Champion
						</a>
					</th:block>

					<th:block sec:authorize="hasRole('ADMIN')">
						<a th:href="@{/admin/scraper}"
						   class="button small primary"
						   onclick="showLoading('Loading Dashboard...')">
							<i class="fas fa-cloud-download-alt"></i> Scrape Factions
						</a>
					</th:block>
				</div>

				<div id="champion-grid-container">
					<th:block th:each="champion : ${champions}">
						<div th:replace="~{inserts/champion-card :: card(champion=${champion}, ownedChampionIds=${ownedChampionIds})}"></div>
					</th:block>
				</div>
			</section>
		</div>
	</section>

	<div id="save-roster-bar" th:if="${isLoggedIn}">
		<div style="margin-right: 20px;">
			<span th:text="${isManagementMode ? 'Managing Roster for:' : 'Editing Roster for:'}">Editing:</span>
			<strong th:text="${targetMember != null ? targetMember.ingameName : 'Unknown'}" style="color: #2ecc71;">User</strong>
			(<span id="selected-count" th:text="${ownedChampionIds != null ? ownedChampionIds.size() : 0}">0</span> selected)
		</div>

		<form id="roster-form" method="POST" th:action="@{/champions/roster-save}" onsubmit="prepareRosterSubmission()">
			<input type="hidden" name="targetMemberId" th:value="${targetMember != null ? targetMember.id.toHexString() : ''}" />
			<input type="hidden" name="championIds" id="final-champion-ids" />

			<button type="button" class="button small cancel-btn" onclick="toggleRosterMode()" style="margin-right: 10px;">
				Cancel
			</button>
			<button type="submit" class="button small primary">
				<i class="fas fa-save"></i> Save Changes
			</button>
		</form>
	</div>

	<div th:insert="~{inserts/copyright :: copyright}" id="copyright">
	</div>
</div>
<button id="backToTopBtn" title="Go to top">
	↑
</button>

<script th:inline="javascript">
	/*[+
       const initialOwned = [[${ownedChampionIds}]];
       const autoOpenEditMode = [[${autoOpenEditMode}]];
    +]*/

    const selectedChampionIds = new Set(initialOwned || []);
    let isEditingRoster = false;

    function toggleRosterMode() {
        isEditingRoster = !isEditingRoster;
        const body = document.body;
        const saveBar = document.getElementById('save-roster-bar');
        const toggleBtn = document.getElementById('roster-toggle-btn');

        if (isEditingRoster) {
            body.classList.add('roster-editing');
            saveBar.classList.add('visible');
            toggleBtn.style.display = 'none';
        } else {
            body.classList.remove('roster-editing');
            saveBar.classList.remove('visible');
            toggleBtn.style.display = 'inline-block';
        }
    }

    function handleCardClick(champId) {
        if (!isEditingRoster) return;

        console.log("Toggling Selection for:", champId);
        const card = document.getElementById('card-' + champId);

        if (selectedChampionIds.has(champId)) {
            selectedChampionIds.delete(champId);
            card.classList.remove('selected');
        } else {
            selectedChampionIds.add(champId);
            card.classList.add('selected');
        }

        updateCountDisplay();
    }

    function updateCountDisplay() {
        const countSpan = document.getElementById('selected-count');
        if (countSpan) {
            countSpan.innerText = selectedChampionIds.size;
        }
    }

    function prepareRosterSubmission() {
        showLoading('Saving Roster...');
        const input = document.getElementById('final-champion-ids');
        input.value = Array.from(selectedChampionIds).join(',');
    }

    document.addEventListener("DOMContentLoaded", function() {
        const images = document.querySelectorAll("img.champion-portrait");
        const placeholder = "/images/champion-cards/placeholder.png";

        images.forEach(function(img) {
            img.onerror = function() {
                this.onerror = null;
                this.src = placeholder;
            };

            if (img.complete && img.naturalWidth === 0) {
                img.src = placeholder;
            }
        });

        // Story #7: Auto-open editing if requested by Controller (Self or Other)
        if (autoOpenEditMode) {
            toggleRosterMode();
        }
    });
</script>
</body>
</html>
