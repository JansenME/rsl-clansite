<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{inserts/head :: head(pageTitle='Scraper Dashboard')}">
</head>
<body>
<div id="page-wrapper">
    <section id="header">
        <div th:insert="~{inserts/nav :: nav}" class="container"></div>
    </section>

    <section id="content">
        <div class="container">
            <section>
                <h2>Champion Data Integrity Dashboard</h2>
                <p>Compare your target data (Database) against your Champions Collection.<br/>
                    <small>Update the "Tgt" columns to match the in-game index, then click Save.</small>
                </p>

                <div th:replace="~{inserts/alerts :: alerts}"></div>

                <form method="POST" th:action="@{/admin/scraper/targets/update}">

                    <div style="text-align: right; margin-bottom: 10px;">
                        <button type="submit" class="button small primary">
                            <i class="fas fa-save"></i> Save All Targets
                        </button>
                    </div>

                    <div style="overflow-x: auto;">
                        <table class="dashboard-table">
                            <thead>
                            <tr>
                                <th rowspan="2">Faction</th>
                                <th th:each="rarity : ${rarities}" colspan="3" class="border-left-thick" th:text="${rarity.name}">
                                    RARITY
                                </th>
                                <th rowspan="2" class="border-left-thick">Action</th>
                            </tr>
                            <tr>
                                <th:block th:each="rarity : ${rarities}">
                                    <th class="border-left-thick" title="My Target (Database)">Tgt</th>
                                    <th title="In Database">DB</th>
                                    <th>Diff</th>
                                </th:block>
                            </tr>
                            </thead>

                            <th:block th:each="group : ${allianceGroups}">
                                <tbody>
                                <tr class="alliance-header-row">
                                    <td colspan="100%" class="alliance-header-cell">
                                        <span th:text="${group.alliance.name}">Alliance Name</span>
                                        <span style="font-weight: normal; margin-left: 10px; font-size: 0.9em;">
                                                (<span th:text="${group.totalChampions}">0</span> / <span th:text="${group.totalTargets}">0</span> champions)
                                            </span>
                                    </td>
                                </tr>

                                <tr th:each="row : ${group.rows}">
                                    <td class="text-left" style="font-weight: bold; padding-left: 2em;" th:text="${row.faction.name}">
                                        Faction Name
                                    </td>

                                    <th:block th:each="rarity : ${rarities}">
                                        <td class="border-left-thick">
                                            <input type="number"
                                                   class="target-input"
                                                   th:name="${row.faction.name} + '_' + ${rarity.name}"
                                                   th:value="${row.targets.get(rarity)}"
                                                   min="0" />
                                        </td>

                                        <td th:text="${row.database.get(rarity)}">0</td>

                                        <td th:with="diff=${row.getDiff(rarity)}"
                                            th:text="${diff}"
                                            th:classappend="${diff > 0} ? 'diff-error' : 'diff-ok'">
                                            0
                                        </td>
                                    </th:block>

                                    <td class="border-left-thick">
                                        <span th:if="${row.isComplete()}" class="diff-ok"><i class="fas fa-check"></i></span>

                                        <button th:if="${!row.isComplete() and row.isUpdateAvailable()}"
                                                type="submit"
                                                class="button primary small"
                                                th:formaction="@{/admin/scraper/faction/{name}/execute(name=${#strings.replace(row.faction.name, ' ', '-')})}"
                                                onclick="showLoading('Importing...')">
                                            Check
                                        </button>

                                        <span th:if="${!row.isComplete() and !row.isUpdateAvailable()}" class="diff-error"><i class="fas fa-times"></i></span>
                                    </td>
                                </tr>
                                </tbody>
                            </th:block>
                        </table>
                    </div>

                    <div style="text-align: right; margin-top: 10px;">
                        <button type="submit" class="button small primary">
                            <i class="fas fa-save"></i> Save All Targets
                        </button>
                    </div>
                </form>

                <div style="text-align: center; margin-top: 20px; display: flex; justify-content: center; gap: 10px;">
                    <a th:href="@{/admin/data-health}" class="button primary">
                        <i class="fas fa-heartbeat"></i> Data Health
                    </a>

                    <a th:href="@{/champions}" class="button alt">
                        <i class="fas fa-arrow-left"></i> Back to Champions
                    </a>
                </div>
            </section>
        </div>
    </section>

    <div th:insert="~{inserts/copyright :: copyright}" id="copyright"></div>
</div>
</body>
</html>
