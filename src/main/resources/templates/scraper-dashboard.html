<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Scraper Dashboard</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" th:href="@{/styles/css/main.css}" />
    <script th:src="@{/styles/js/main.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        /* Custom styles for the data dashboard */
        .diff-error { color: #e44c65; font-weight: bold; } /* Red: Missing champions */
        .diff-ok { color: #4caf50; opacity: 0.7; }         /* Green: Complete */

        table.dashboard-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8em;
        }
        table.dashboard-table th, table.dashboard-table td {
            border: 1px solid #e1e1e1;
            padding: 0.5em;
            text-align: center;
            vertical-align: middle;
        }
        table.dashboard-table th {
            background-color: #f4f4f4;
            color: #333;
            font-weight: bold;
        }
        .border-left-thick { border-left: 2px solid #ccc !important; }
        .text-left { text-align: left !important; }
    </style>
</head>
<body>
<div id="page-wrapper">
    <section id="header">
        <div th:insert="~{inserts/nav :: nav}" class="container"></div>
    </section>

    <section id="content">
        <div class="container">
            <section>
                <h2>Champion Data Integrity Dashboard</h2>
                <p>Compare your target data (JSON) against your Database. <br/>
                    <small>The "Check" button only appears if HellHades has newer data than your database.</small>
                </p>

                <div th:replace="~{inserts/alerts :: alerts}"></div>

                <div style="overflow-x: auto; margin-top: 2em;">
                    <table class="dashboard-table">
                        <thead>
                        <tr>
                            <th rowspan="2">Faction</th>
                            <th th:each="rarity : ${rarities}" colspan="3" class="border-left-thick" th:text="${rarity.name}">
                                RARITY
                            </th>
                            <th rowspan="2" class="border-left-thick">Action</th>
                        </tr>
                        <tr>
                            <th:block th:each="rarity : ${rarities}">
                                <th class="border-left-thick" title="My Target (Json)">Tgt</th>
                                <th title="In Database">DB</th>
                                <th>Diff</th>
                            </th:block>
                        </tr>
                        </thead>

                        <th:block th:each="group : ${allianceGroups}">
                            <tbody>
                            <tr style="background-color: #e0e0e0; border-top: 2px solid #999;">
                                <td colspan="100%" style="text-align: center; padding-left: 15px; font-weight: bold; color: #333;">
                                    <span th:text="${group.alliance.name}">Alliance Name</span>
                                    <span style="font-weight: normal; margin-left: 10px; font-size: 0.9em;">
                                            (<span th:text="${group.totalChampions}">0</span> champions)
                                        </span>
                                </td>
                            </tr>

                            <tr th:each="row : ${group.rows}">
                                <td class="text-left" style="font-weight: bold; padding-left: 2em;" th:text="${row.faction.name}">
                                    Faction Name
                                </td>

                                <th:block th:each="rarity : ${rarities}">
                                    <td class="border-left-thick" th:text="${row.targets.get(rarity)}">0</td>
                                    <td th:text="${row.database.get(rarity)}">0</td>
                                    <td th:with="diff=${row.getDiff(rarity)}"
                                        th:text="${diff}"
                                        th:classappend="${diff > 0} ? 'diff-error' : 'diff-ok'">
                                        0
                                    </td>
                                </th:block>

                                <td class="border-left-thick">
                                    <span th:if="${row.isComplete()}" class="diff-ok"><i class="fas fa-check"></i></span>

                                    <form th:if="${!row.isComplete() and row.isUpdateAvailable()}"
                                          method="post"
                                          th:action="@{/admin/scraper/faction/{name}/execute(name=${#strings.replace(row.faction.name, ' ', '-')})}">
                                        <button type="submit" class="button primary small fit">Check</button>
                                    </form>

                                    <span th:if="${!row.isComplete() and !row.isUpdateAvailable()}" class="diff-error"><i class="fas fa-times"></i></span>
                                </td>
                            </tr>
                            </tbody>
                        </th:block>
                    </table>
                </div>

                <div style="text-align: center; margin-top: 20px;">
                    <a th:href="@{/champions}" class="button">Back to Champions</a>
                </div>
            </section>
        </div>
    </section>

    <div th:insert="~{inserts/copyright :: copyright}" id="copyright"></div>
</div>
</body>
</html>
