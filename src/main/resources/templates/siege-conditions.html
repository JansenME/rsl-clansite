<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Siege Conditions Management</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" th:href="@{/styles/css/main.css}" />
    <script th:src="@{/styles/js/main.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body>
<div id="page-wrapper">
    <section id="header">
        <div th:insert="~{inserts/nav :: nav}" class="container">
        </div>
    </section>

    <section id="content">
        <div class="container">
            <section>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
                    <h2>Siege Conditions Configuration</h2>

                    <div th:if="${successMessage}" class="alert alert-success">
                        <span th:text="${successMessage}"></span>
                    </div>
                    <div th:if="${errorMessage}" class="alert alert-danger">
                        <span th:text="${errorMessage}"></span>
                    </div>

                    <form th:action="@{/admin/siege-conditions/sync}" method="POST" style="margin: 0;">
                        <button type="submit" class="button small primary">
                            <i class="fas fa-sync"></i> Scan for new possible conditions
                        </button>
                    </form>
                </div>

                <p>Manage the list of active Siege Conditions available for players to select on their profiles.</p>

                <table style="width: 100%;">
                    <thead>
                    <tr>
                        <th>Category</th>
                        <th>Condition Name</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="condition : ${conditions}"
                        th:style="${!condition.isActive} ? 'opacity: 0.6; background: #f9f9f9;' : ''">

                        <td data-label="Category" style="font-weight: bold; color: #555;">
                            <span th:text="${condition.category.displayName}">Category</span>
                        </td>

                        <td data-label="Condition Name" th:text="${#strings.capitalizeWords(#strings.toLowerCase(#strings.replace(condition.conditionKey, '_', ' ')))}">Key</td>

                        <td data-label="Status">
                       <span th:if="${condition.isActive}" class="status-ok">
                           <i class="fas fa-check-circle"></i> Active
                       </span>
                            <span th:unless="${condition.isActive}" style="color: #7f8c8d;">
                           <i class="fas fa-ban"></i> Inactive
                       </span>
                        </td>

                        <td data-label="Action">
                            <form th:action="@{/admin/siege-conditions/{id}/toggle(id=${condition.id})}" method="POST" style="margin: 0;">
                                <button type="submit" class="button small"
                                        th:classappend="${condition.isActive} ? 'danger' : 'success'">
                                    <span th:text="${condition.isActive} ? 'Deactivate' : 'Activate'">Toggle</span>
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <div th:if="${conditions.isEmpty()}">
                    <p>No conditions found. Please click "Scan for New Enums" to populate the database.</p>
                </div>
            </section>
        </div>
    </section>

    <div th:insert="~{inserts/copyright :: copyright}" id="copyright">
    </div>
</div>
</body>
</html>
