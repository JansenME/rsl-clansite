app:
  version: '@project.version@'
discord:
  bot-token: ${DISCORD_BOT_TOKEN}
  clan-server-id: "1062302225701015552"
spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: raidshadowlegends
  session:
    store-type: mongodb
    timeout-seconds: 31536000
  security:
    oauth2:
      client:
        registration:
          discord:
            client-id: "1449091367102840907"
            client-secret: ${DISCORD_CLIENT_SECRET}
            client-name: Discord
            provider: discord
            scope: identify, guilds, guilds.members.read
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
        provider:
          discord:
            authorization-uri: https://discord.com/oauth2/authorize
            token-uri: https://discord.com/api/oauth2/token
            user-info-uri: https://discord.com/api/users/@me
            user-name-attribute: id
  application:
    name: Clansite Raid Shadow Legends
server:
  servlet:
    session:
      timeout: 31536000
  port: 8080
  error:
    whitelabel:
      enabled: false
    path: /error
logging:
  file:
    name: /logs/rsl-clansite.log
  pattern:
    console: "%d{dd-MM-yyyy HH:mm:ss.SSS} %5p [%X{sessionId}] --- [%t] %-40.40logger{39} : %m%n%wEx"
management:
  endpoints:
    web:
      exposure:
        include: "*"