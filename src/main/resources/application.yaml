app:
  version: '@project.version@'
spring:
  application:
    name: Clansite Raid Shadow Legends
server:
  port: 8080
  error:
    whitelabel:
      enabled: false
    path: /error
logging:
  file:
    name: /logs/rsl-clansite.log
  pattern:
    console: "%d{dd-MM-yyyy HH:mm:ss.SSS} %5p %X{process_id} --- [%t] %-40.40logger{39} : %m%n%wEx"
management:
  endpoints:
    web:
      exposure:
        include: "*"